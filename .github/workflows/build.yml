name: CI

on: push

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python_version: ${matrix.python_version}

    - name: Install Python deps & ZCompose
      run: pip install . pytest ruff

    - name: Check formatting
      run: ruff  format --check --diff --color always .

    - name: Check linting
      run: ruff check --diff --color always .

    - name: Run tests
      run: pytest tests/
